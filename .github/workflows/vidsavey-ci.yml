name: VIDSAVEY integration checks

on:
  pull_request:
    paths:
      - "server/**"
      - "components/**"
      - "app/**"
      - "package*.json"
      - ".github/workflows/vidsavey-ci.yml"
  push:
    branches:
      - "feature/vidfetch-snapany-daily-limit-client-20261109"

permissions:
  contents: read

jobs:
  backend-offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration bridge test dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run offline provider, quota and budget regression tests
        working-directory: server
        run: python -m pytest -q
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check Next.js build
        run: npm run build
      - name: Check Cloudflare vinext build
        run: npm run build:vinext
